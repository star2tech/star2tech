<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150" role="img" aria-label="Hiwot. Student, builder, math and art." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .name { font: 600 56px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; letter-spacing: -1px; }
    .sub  { font: 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #57606a; }
    .line { stroke: #7c5cff; stroke-width: 3; stroke-linecap: round; }
    .cur  { fill: #7c5cff; }
    @media (prefers-color-scheme: dark) {
      .name { fill: #f0f6fc; }
      .sub  { fill: #8b949e; }
    }
    .name { opacity: 0; animation: rise 0.9s ease-out 0.2s forwards; }
    .sub  { opacity: 0; animation: rise 0.9s ease-out 0.7s forwards; }
    .line { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 1s ease-out 0.1s forwards; }
    .cur  { opacity: 0; animation: show 0s 1.4s forwards, blink 1.1s steps(1) 1.8s infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes rise  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes draw  { to { stroke-dashoffset: 0; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
  <line class="line" x1="4" y1="28" x2="124" y2="28"/>
  <text class="name" x="2" y="92">Hiwot</text>
  <text class="sub" x="4" y="126">student / builder / math + art</text>
  <rect class="cur" x="296" y="113" width="9" height="16"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
