<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-labelledby="title desc">
  <title id="title">My bookshelf</title>
  <desc id="desc">A shelf of eight books: Fahrenheit 451 by Ray Bradbury; 1984 by George Orwell; The Princess Saves Herself in This One by Amanda Lovelace; First to a Million by Dan Sheeks; Atomic Habits by James Clear; Thinking, Fast and Slow by Daniel Kahneman; This Heart of Mine by C.C. Hunter; The Courage to Be Disliked by Ichiro Kishimi and Fumitake Koga</desc>
  <style>
    .book { animation: arrive 650ms cubic-bezier(.2,.7,.2,1) both; }
    @keyframes arrive {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .spine-title {
      font-family: Georgia, 'Times New Roman', serif;
      fill: #1c2620;
    }
    @media (prefers-reduced-motion: reduce) {
      .book { animation: none; }
    }
  </style>

  <!-- paper card -->
  <rect x="0.5" y="0.5" width="879" height="339" rx="18" fill="#f7f2e7" stroke="#e2d7c1"/>

  <!-- shelf plank -->
  <rect x="26" y="305" width="828" height="11" rx="3" fill="#d3b891"/>
  <path d="M32 316 H848" stroke="#b1946d" stroke-width="2" stroke-linecap="round" opacity=".55"/>

  <g class="book" style="animation-delay:0ms">
    <title>Fahrenheit 451 — Ray Bradbury</title>
    <rect x="44" y="54" width="88" height="252" rx="4" fill="#b77965"/>
    <path d="M51 57 V303" stroke="white" stroke-opacity=".18" stroke-width="2"/>
    <path d="M57 70 H119 M57 290 H119" stroke="#202724" stroke-opacity=".3"/>
    <text class="spine-title" transform="translate(93 180) rotate(90)" text-anchor="middle" dominant-baseline="middle" font-size="15">Fahrenheit 451</text>
  </g>

  <g class="book" style="animation-delay:95ms">
    <title>1984 — George Orwell</title>
    <rect x="143" y="33" width="88" height="273" rx="4" fill="#758b85"/>
    <path d="M150 36 V303" stroke="white" stroke-opacity=".18" stroke-width="2"/>
    <path d="M156 49 H218 M156 290 H218" stroke="#202724" stroke-opacity=".3"/>
    <text class="spine-title" transform="translate(192 169.5) rotate(90)" text-anchor="middle" dominant-baseline="middle" font-size="15">1984</text>
  </g>

  <g class="book" style="animation-delay:190ms">
    <title>The Princess Saves Herself in This One — Amanda Lovelace</title>
    <rect x="242" y="43" width="88" height="263" rx="4" fill="#b28a98"/>
    <path d="M249 46 V303" stroke="white" stroke-opacity=".18" stroke-width="2"/>
    <path d="M255 59 H317 M255 290 H317" stroke="#202724" stroke-opacity=".3"/>
    <text class="spine-title" transform="translate(291 174.5) rotate(90)" text-anchor="middle" dominant-baseline="middle" font-size="13" textLength="218" lengthAdjust="spacingAndGlyphs">The Princess Saves Herself in This One</text>
  </g>

  <g class="book" style="animation-delay:285ms">
    <title>First to a Million — Dan Sheeks</title>
    <rect x="341" y="61" width="88" height="245" rx="4" fill="#c4aa72"/>
    <path d="M348 64 V303" stroke="white" stroke-opacity=".18" stroke-width="2"/>
    <path d="M354 77 H416 M354 290 H416" stroke="#202724" stroke-opacity=".3"/>
    <text class="spine-title" transform="translate(390 183.5) rotate(90)" text-anchor="middle" dominant-baseline="middle" font-size="14">First to a Million</text>
  </g>

  <g class="book" style="animation-delay:380ms">
    <title>Atomic Habits — James Clear</title>
    <rect x="440" y="28" width="88" height="278" rx="4" fill="#91a17f"/>
    <path d="M447 31 V303" stroke="white" stroke-opacity=".18" stroke-width="2"/>
    <path d="M453 44 H515 M453 290 H515" stroke="#202724" stroke-opacity=".3"/>
    <text class="spine-title" transform="translate(489 167) rotate(90)" text-anchor="middle" dominant-baseline="middle" font-size="15">Atomic Habits</text>
  </g>

  <g class="book" style="animation-delay:475ms">
    <title>Thinking, Fast and Slow — Daniel Kahneman</title>
    <rect x="539" y="38" width="88" height="268" rx="4" fill="#7b91a5"/>
    <path d="M546 41 V303" stroke="white" stroke-opacity=".18" stroke-width="2"/>
    <path d="M552 54 H614 M552 290 H614" stroke="#202724" stroke-opacity=".3"/>
    <text class="spine-title" transform="translate(588 172) rotate(90)" text-anchor="middle" dominant-baseline="middle" font-size="14">Thinking, Fast and Slow</text>
  </g>

  <g class="book" style="animation-delay:570ms">
    <title>This Heart of Mine — C.C. Hunter</title>
    <rect x="638" y="56" width="88" height="250" rx="4" fill="#ab8b73"/>
    <path d="M645 59 V303" stroke="white" stroke-opacity=".18" stroke-width="2"/>
    <path d="M651 72 H713 M651 290 H713" stroke="#202724" stroke-opacity=".3"/>
    <text class="spine-title" transform="translate(687 181) rotate(90)" text-anchor="middle" dominant-baseline="middle" font-size="14">This Heart of Mine</text>
  </g>

  <g class="book" style="animation-delay:665ms">
    <title>The Courage to Be Disliked — Ichiro Kishimi and Fumitake Koga</title>
    <rect x="737" y="31" width="88" height="275" rx="4" fill="#7f977d"/>
    <path d="M744 34 V303" stroke="white" stroke-opacity=".18" stroke-width="2"/>
    <path d="M750 47 H812 M750 290 H812" stroke="#202724" stroke-opacity=".3"/>
    <text class="spine-title" transform="translate(786 168.5) rotate(90)" text-anchor="middle" dominant-baseline="middle" font-size="13">The Courage to Be Disliked</text>
  </g>
</svg>
